version: 2.1
orbs:
  glidr-microservice-orb: launchpadcentral/glidr-microservice-orb@volatile
jobs:
  build:
    executor:
      name: glidr-microservice-orb/default
      working_directory: /go/src/github.com/launchpadcentral/govalidator
    steps:
      - checkout
      - run: go get -v -t -d ./...
      - run: go test -v ./...

workflows:
  version: 2
  test-and-build:
    jobs:
      - build:
          context: org-global
